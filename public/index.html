      var name=f.name.replace(/\.(jpg|jpeg|png|webp)$/i,"");

}

/* CONFIG */
const API_URL="/api/query";
const API_TOKEN="";

async function runQuery(query, params={}){
  const headers={"Content-Type":"application/json","ngrok-skip-browser-warning":"true"};
  if(API_TOKEN)headers["Authorization"]="Bearer "+API_TOKEN;
  var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort()},35000);
  var res;
  try{res=await fetch(API_URL,{method:"POST",headers,body:JSON.stringify({query,parameters:params}),signal:ctrl.signal});}
  catch(e){clearTimeout(timer);throw new Error(e.name==="AbortError"?"The data server did not respond (timeout). Please try again.":"Cannot reach the data server. Check your connection and try again.");}
  clearTimeout(timer);
  if(!res.ok){var et="";try{var ej=await res.json();et=ej.message||ej.error||""}catch(x){try{et=await res.text()}catch(y){}}throw new Error("HTTP "+res.status+(et?" — "+et:""));}
  const j=await res.json();
  if(j.status!=="success")throw new Error(j.message||"Query failed");
  return j.data||[];
}
function fmtD(d){return d.replace(/-/g,"");}
/* Local (Mexico City) date helpers — avoid UTC drift from toISOString() */
function todayLocal(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function addDaysLocal(iso,n){var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dy=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dy;}
function daysAgoLocal(n){return addDaysLocal(todayLocal(),-n);}
function monthStartLocal(){return todayLocal().slice(0,8)+"01";}
/* CSV export */
function downloadCSV(name,rows){
  if(!rows||!rows.length)return;
  var cols=Object.keys(rows[0]).filter(function(c){return c.charAt(0)!=="_"});
  var esc=function(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var csv=cols.join(",")+"\n"+rows.map(function(r){return cols.map(function(c){return esc(r[c])}).join(",")}).join("\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");
  a.href=url;a.download=name+".csv";document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

/* Centralized magic values — one place to change store tables and online-sale markers */
const TBL={Circunvalacion:"MOVS_CIRCUNVALACION","Leona Vicario":"MOVS_LEONA",Lucumberri:"MOVS_LECUMBERRI",Chinconcuac:"MOVS_CHINCONCUAC",Yazmin:"MOVS_CIRCUNVALACION",Jazmin:"MOVS_CIRCUNVALACION"};

/* SQL — Jazmin separated: Circunvalacion excludes YAZMIN, Jazmin is own row */
const SQL={
storeSummary:()=>"SELECT 'Circunvalacion' AS Store_Name,COUNT(DISTINCT M.NO_REFEREN) AS Ticket_Count,ISNULL(ROUND(SUM(M.Cantidad*M.Precio_Venta),0),0) AS Total_Sales,ISNULL(ROUND(SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad),0),0) AS Total_Profit,CASE WHEN COUNT(DISTINCT M.NO_REFEREN)>0 THEN ROUND(SUM(M.Cantidad*M.Precio_Venta)*1.0/COUNT(DISTINCT M.NO_REFEREN),0) ELSE 0 END AS Avg_Ticket_Value,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TRANSFER%' AND NOT(ISNULL(M.PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(M.PAGO2,'')))<>'') THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) AS Cash_Sales,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TARJETA%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) AS Card_Sales,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND(UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TRANSFER%' OR (ISNULL(M.PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(M.PAGO2,'')))<>'')) THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) AS Transfer_Sales FROM MOVS_CIRCUNVALACION M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' AND NOT EXISTS(SELECT 1 FROM MOVS_CIRCUNVALACION Y WHERE Y.NO_REFEREN=M.NO_REFEREN AND Y.FECHA='{{fecha}}' AND Y.Movimiento='TK' AND Y.Vendedor='YAZMIN') UNION ALL SELECT 'Jazmin',COUNT(DISTINCT M.NO_REFEREN),ISNULL(ROUND(SUM(M.Cantidad*M.Precio_Venta),0),0),ISNULL(ROUND(SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad),0),0),CASE WHEN COUNT(DISTINCT M.NO_REFEREN)>0 THEN ROUND(SUM(M.Cantidad*M.Precio_Venta)*1.0/COUNT(DISTINCT M.NO_REFEREN),0) ELSE 0 END,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TRANSFER%' AND NOT(ISNULL(M.PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(M.PAGO2,'')))<>'') THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TARJETA%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND(UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TRANSFER%' OR (ISNULL(M.PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(M.PAGO2,'')))<>'')) THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) FROM MOVS_CIRCUNVALACION M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' AND EXISTS(SELECT 1 FROM MOVS_CIRCUNVALACION Y WHERE Y.NO_REFEREN=M.NO_REFEREN AND Y.FECHA='{{fecha}}' AND Y.Movimiento='TK' AND Y.Vendedor='YAZMIN') UNION ALL SELECT 'Leona Vicario',COUNT(DISTINCT M.NO_REFEREN),ISNULL(ROUND(SUM(M.Cantidad*M.Precio_Venta),0),0),ISNULL(ROUND(SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad),0),0),CASE WHEN COUNT(DISTINCT M.NO_REFEREN)>0 THEN ROUND(SUM(M.Cantidad*M.Precio_Venta)*1.0/COUNT(DISTINCT M.NO_REFEREN),0) ELSE 0 END,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TRANSFER%' AND NOT(ISNULL(M.PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(M.PAGO2,'')))<>'') THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TARJETA%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND(UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TRANSFER%' OR (ISNULL(M.PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(M.PAGO2,'')))<>'')) THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) FROM MOVS_LEONA M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' UNION ALL SELECT 'Lucumberri',COUNT(DISTINCT M.NO_REFEREN),ISNULL(ROUND(SUM(M.Cantidad*M.Precio_Venta),0),0),ISNULL(ROUND(SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad),0),0),CASE WHEN COUNT(DISTINCT M.NO_REFEREN)>0 THEN ROUND(SUM(M.Cantidad*M.Precio_Venta)*1.0/COUNT(DISTINCT M.NO_REFEREN),0) ELSE 0 END,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TRANSFER%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TARJETA%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TRANSFER%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) FROM MOVS_LECUMBERRI M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' UNION ALL SELECT 'Chinconcuac',COUNT(DISTINCT M.NO_REFEREN),ISNULL(ROUND(SUM(M.Cantidad*M.Precio_Venta),0),0),ISNULL(ROUND(SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad),0),0),CASE WHEN COUNT(DISTINCT M.NO_REFEREN)>0 THEN ROUND(SUM(M.Cantidad*M.Precio_Venta)*1.0/COUNT(DISTINCT M.NO_REFEREN),0) ELSE 0 END,ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TARJETA%' AND UPPER(ISNULL(M.Tarjetas,'')) NOT LIKE '%TRANSFER%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TARJETA%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0),ISNULL(ROUND(SUM(CASE WHEN UPPER(ISNULL(M.Tarjetas,'')) LIKE '%TRANSFER%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),0) FROM MOVS_CHINCONCUAC M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK'",

tickets:(f,store)=>{const t=TBL[store]||"MOVS_CIRCUNVALACION";const hasDep=t==="MOVS_CIRCUNVALACION"||t==="MOVS_LEONA";const yf=store==="Jazmin"?" AND EXISTS(SELECT 1 FROM MOVS_CIRCUNVALACION Y WHERE Y.NO_REFEREN=M.NO_REFEREN AND Y.FECHA='{{fecha}}' AND Y.Movimiento='TK' AND Y.Vendedor='YAZMIN')":(store==="Circunvalacion"?" AND NOT EXISTS(SELECT 1 FROM MOVS_CIRCUNVALACION Y WHERE Y.NO_REFEREN=M.NO_REFEREN AND Y.FECHA='{{fecha}}' AND Y.Movimiento='TK' AND Y.Vendedor='YAZMIN')":"");return "SELECT '"+store+"' AS Store,M.NO_REFEREN AS Ticket,CAST(ROUND(SUM(M.Cantidad*M.Precio_Venta),0)AS INT) AS Total_Amount,CAST(ROUND(SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad),0)AS INT) AS Ticket_Profit,CAST(CASE WHEN SUM(M.Cantidad*M.Precio_Venta)=0 THEN 0 ELSE ROUND(100.0*SUM((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad)/SUM(M.Cantidad*M.Precio_Venta),2)END AS DECIMAL(10,2)) AS Profit_Percentage,COUNT(*) AS Item_Count,MAX(M.Tarjetas) AS Tarjetas,"+(hasDep?"MAX(ISNULL(M.PrEnvio,0))":"0")+" AS PrEnvio,"+(hasDep?"MAX(ISNULL(M.PAGO2,''))":"''")+" AS Pago2 FROM "+t+" M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK'"+yf+" GROUP BY M.NO_REFEREN ORDER BY M.NO_REFEREN";},

ticketDetail:(f,ticket,store)=>{const t=TBL[store]||"MOVS_CIRCUNVALACION";const hasDep=t==="MOVS_CIRCUNVALACION"||t==="MOVS_LEONA";const yf="";return "SELECT '"+store+"' AS Store,M.NO_REFEREN AS Ticket,M.Articulo AS Item_Code,M.Descripcion AS Description,M.Cantidad AS Quantity,M.Precio_Venta AS Unit_Price,ROUND(M.Cantidad*M.Precio_Venta,0) AS Line_Total,ISNULL(C.Costo,0) AS Cost,ROUND((M.Precio_Venta-ISNULL(C.Costo,0))*M.Cantidad,0) AS Line_Profit,CAST(CASE WHEN M.Precio_Venta=0 THEN 0 ELSE ROUND(100.0*(M.Precio_Venta-ISNULL(C.Costo,0))/M.Precio_Venta,2)END AS DECIMAL(10,2)) AS Profit_Percentage,M.Tarjetas AS Tarjetas,"+(hasDep?"ISNULL(M.PrEnvio,0)":"0")+" AS PrEnvio,"+(hasDep?"ISNULL(M.PAGO2,'')":"''")+" AS Pago2 FROM "+t+" M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.NO_REFEREN='"+ticket+"'"+yf+" ORDER BY M.Articulo";},

topItems:()=>"SELECT TOP 20 CI.Articulo AS Item_Code,MAX(CI.Descripcion) AS Description,SUM(CI.Cantidad) AS Total_Quantity,SUM(CI.Cantidad*CI.Precio_Venta) AS Total_Sales,SUM((CI.Precio_Venta-ISNULL(CI.Costo,0))*CI.Cantidad) AS Total_Profit,CAST(CASE WHEN SUM(CI.Cantidad*CI.Precio_Venta)=0 THEN 0 ELSE ROUND(100.0*SUM((CI.Precio_Venta-ISNULL(CI.Costo,0))*CI.Cantidad)/SUM(CI.Cantidad*CI.Precio_Venta),2)END AS DECIMAL(10,2)) AS Profit_Percentage,COUNT(DISTINCT CI.StoreSource) AS Store_Count FROM(SELECT M.Articulo,M.Descripcion,M.Cantidad,M.Precio_Venta,'CERCU' AS StoreSource,C.Costo FROM MOVS_CIRCUNVALACION M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' UNION ALL SELECT M.Articulo,M.Descripcion,M.Cantidad,M.Precio_Venta,'LEONA',C.Costo FROM MOVS_LEONA M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' UNION ALL SELECT M.Articulo,M.Descripcion,M.Cantidad,M.Precio_Venta,'LUCUM',C.Costo FROM MOVS_LECUMBERRI M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK' UNION ALL SELECT M.Articulo,M.Descripcion,M.Cantidad,M.Precio_Venta,'CHINCO',C.Costo FROM MOVS_CHINCONCUAC M LEFT JOIN SAP_CC C ON C.Articulo=M.Articulo WHERE M.FECHA='{{fecha}}' AND M.Movimiento='TK')AS CI GROUP BY CI.Articulo ORDER BY Total_Sales DESC",

deposits:()=>"SELECT 'Circunvalacion' AS Branch,NO_REFEREN AS Ticket,ROUND(SUM(Cantidad*Precio_Venta),0) AS Total,PrEnvio AS Bank_Deposit,MAX(Tarjetas) AS Cards,MAX(Fecha) AS Date,UPPER(MAX(Vendedor)) AS Seller,UPPER(MAX(CustCliente)) AS Customer,UPPER(MAX(PAGO2)) AS Account,MAX(CustPhone) AS Phone FROM MOVS_CIRCUNVALACION WHERE PAGO2<>'' AND CONVERT(DATE,Fecha)='{{fecha}}' GROUP BY NO_REFEREN,PrEnvio UNION ALL SELECT 'Leona Vicario',NO_REFEREN,ROUND(SUM(Cantidad*Precio_Venta),0),PrEnvio,MAX(Tarjetas),MAX(Fecha),UPPER(MAX(Vendedor)),UPPER(MAX(CustCliente)),UPPER(MAX(PAGO2)),MAX(CustPhone) FROM MOVS_LEONA WHERE PAGO2<>'' AND CONVERT(DATE,Fecha)='{{fecha}}' GROUP BY NO_REFEREN,PrEnvio",

inventory:()=>"SELECT I.Articulo,ISNULL(ROUND(MAX(C.Costo),0),0) AS Costo,SUM(CASE WHEN I.Store='Circunvalacion' THEN I.EXISTENCIA ELSE 0 END) AS Cercu,SUM(CASE WHEN I.Store='Leona' THEN I.EXISTENCIA ELSE 0 END) AS Leona,SUM(CASE WHEN I.Store='Lecumberri' THEN I.EXISTENCIA ELSE 0 END) AS Lucum,SUM(CASE WHEN I.Store='Chinconcuac' THEN I.EXISTENCIA ELSE 0 END) AS Chinco,SUM(CASE WHEN I.Store='Bodega' THEN I.EXISTENCIA ELSE 0 END) AS Bodega,SUM(I.EXISTENCIA) AS Total FROM(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,EXISTENCIA,'Circunvalacion' AS Store FROM PRODS_C UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Leona' FROM PRODS_L UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Chinconcuac' FROM PRODS_CHIN UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Lecumberri' FROM PRODS_LECU UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Bodega' FROM SAP_CC)AS I LEFT JOIN(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,ROUND(Costo,0) AS Costo FROM SAP_CC)AS C ON I.Articulo=C.Articulo GROUP BY I.Articulo HAVING SUM(I.EXISTENCIA)>0 ORDER BY SUM(I.EXISTENCIA) DESC",

yazminTickets:()=>"SELECT CONVERT(DATE,FECHA) AS Fecha,NO_REFEREN AS Ticket,SUM(Cantidad*Precio_Venta) AS Total_Amount,ROUND(SUM(Cantidad*Precio_Venta)*0.02,0) AS Commission,COUNT(*) AS Item_Count,MIN(CustPhone) AS Phone,MIN(CustCliente) AS Customer,MIN(CustGuia) AS Guia,MIN(PAGO2) AS Pago2,MIN(PrEnvio) AS Envio FROM MOVS_CIRCUNVALACION WHERE FECHA BETWEEN '{{fecha_inicio}}' AND '{{fecha_fin}}' AND Movimiento='TK' AND Vendedor='YAZMIN' GROUP BY CONVERT(DATE,FECHA),NO_REFEREN ORDER BY CONVERT(DATE,FECHA),NO_REFEREN",

yazminDaily:()=>"SELECT CONVERT(DATE,FECHA) AS Fecha,ROUND(SUM(Cantidad*Precio_Venta),0) AS TotalSale,COUNT(DISTINCT NO_REFEREN) AS Tickets FROM MOVS_CIRCUNVALACION WHERE FECHA BETWEEN '{{fecha_inicio}}' AND '{{fecha_fin}}' AND Movimiento='TK' AND Vendedor='YAZMIN' GROUP BY CONVERT(DATE,FECHA) ORDER BY CONVERT(DATE,FECHA)",

yazminTopCustomers:()=>"SELECT TOP 50 ISNULL(MAX(CustCliente),'') AS Customer,CustPhone AS Phone,SUM(ROUND(Cantidad*Precio_Venta,0)) AS Total_Amount,COUNT(DISTINCT NO_REFEREN) AS Visits FROM MOVS_CIRCUNVALACION WHERE FECHA BETWEEN '{{fecha_inicio}}' AND '{{fecha_fin}}' AND Movimiento='TK' AND Vendedor='YAZMIN' AND CustPhone IS NOT NULL GROUP BY CustPhone ORDER BY Total_Amount DESC",

yazminBigTickets:()=>"SELECT CONVERT(DATE,FECHA) AS Fecha,NO_REFEREN AS Ticket,MIN(CustCliente) AS Customer,MIN(CustPhone) AS Phone,SUM(Cantidad*Precio_Venta) AS Total_Amount,COUNT(*) AS Items FROM MOVS_CIRCUNVALACION WHERE FECHA BETWEEN '{{fecha_inicio}}' AND '{{fecha_fin}}' AND Movimiento='TK' AND Vendedor='YAZMIN' GROUP BY CONVERT(DATE,FECHA),NO_REFEREN HAVING SUM(Cantidad*Precio_Venta)>=10000 ORDER BY Total_Amount DESC",

regularSales:()=>"SELECT C.Articulo,SUM(CASE WHEN C.Store='Circunvalacion' THEN C.Cantidad ELSE 0 END) AS Cercu_Sales,SUM(CASE WHEN C.Store='Circunvalacion - Yazmin' THEN C.Cantidad ELSE 0 END) AS Jazmin_Sales,SUM(CASE WHEN C.Store='Leona' THEN C.Cantidad ELSE 0 END) AS Leona_Sales,SUM(CASE WHEN C.Store='Lecumberri' THEN C.Cantidad ELSE 0 END) AS Lecum_Sales,SUM(CASE WHEN C.Store='Chinconcuac' THEN C.Cantidad ELSE 0 END) AS Chinco_Sales,SUM(C.Cantidad) AS Total_Sales,ROUND(SUM(C.Cantidad*C.Precio_Venta),0) AS Total_Revenue,ROUND(CASE WHEN SUM(C.Cantidad)>0 THEN SUM(C.Cantidad*C.Precio_Venta)/SUM(C.Cantidad) ELSE 0 END,0) AS Avg_Price,ISNULL(ROUND(MAX(D.Costo),0),0) AS Cost,ROUND(ROUND(CASE WHEN SUM(C.Cantidad)>0 THEN SUM(C.Cantidad*C.Precio_Venta)/SUM(C.Cantidad) ELSE 0 END,0)-ISNULL(ROUND(MAX(D.Costo),0),0),0) AS Profit_Per_Pz,ROUND((ROUND(CASE WHEN SUM(C.Cantidad)>0 THEN SUM(C.Cantidad*C.Precio_Venta)/SUM(C.Cantidad) ELSE 0 END,0)-ISNULL(ROUND(MAX(D.Costo),0),0))*SUM(C.Cantidad),0) AS Net_Profit,ISNULL(MAX(I.Cercu_Stock),0) AS Cercu_Stock,ISNULL(MAX(I.Leona_Stock),0) AS Leona_Stock,ISNULL(MAX(I.Chinco_Stock),0) AS Chinco_Stock,ISNULL(MAX(I.Lecum_Stock),0) AS Lecum_Stock,ISNULL(MAX(I.Bodega_Stock),0) AS Bodega_Stock,ISNULL(MAX(I.Total_Stock),0) AS Total_Stock FROM(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,Cantidad,Precio_Venta,'Circunvalacion' AS Store FROM MOVS_CIRCUNVALACION WHERE FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Movimiento='TK' AND NOT EXISTS(SELECT 1 FROM MOVS_CIRCUNVALACION Y WHERE Y.NO_REFEREN=MOVS_CIRCUNVALACION.NO_REFEREN AND Y.FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Y.Movimiento='TK' AND Y.Vendedor='YAZMIN') UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),Cantidad,Precio_Venta,'Circunvalacion - Yazmin' FROM MOVS_CIRCUNVALACION WHERE FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Movimiento='TK' AND EXISTS(SELECT 1 FROM MOVS_CIRCUNVALACION Y WHERE Y.NO_REFEREN=MOVS_CIRCUNVALACION.NO_REFEREN AND Y.FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Y.Movimiento='TK' AND Y.Vendedor='YAZMIN') UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),Cantidad,Precio_Venta,'Leona' FROM MOVS_LEONA WHERE FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Movimiento='TK' UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),Cantidad,Precio_Venta,'Lecumberri' FROM MOVS_LECUMBERRI WHERE FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Movimiento='TK' UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),Cantidad,Precio_Venta,'Chinconcuac' FROM MOVS_CHINCONCUAC WHERE FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND Movimiento='TK')AS C LEFT JOIN(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,SUM(CASE WHEN Store='Circunvalacion' THEN EXISTENCIA ELSE 0 END) AS Cercu_Stock,SUM(CASE WHEN Store='Leona' THEN EXISTENCIA ELSE 0 END) AS Leona_Stock,SUM(CASE WHEN Store='Chinconcuac' THEN EXISTENCIA ELSE 0 END) AS Chinco_Stock,SUM(CASE WHEN Store='Lecumberri' THEN EXISTENCIA ELSE 0 END) AS Lecum_Stock,SUM(CASE WHEN Store='Bodega' THEN EXISTENCIA ELSE 0 END) AS Bodega_Stock,SUM(EXISTENCIA) AS Total_Stock FROM(SELECT Articulo,EXISTENCIA,'Circunvalacion' AS Store FROM PRODS_C UNION ALL SELECT Articulo,EXISTENCIA,'Leona' FROM PRODS_L UNION ALL SELECT Articulo,EXISTENCIA,'Chinconcuac' FROM PRODS_CHIN UNION ALL SELECT Articulo,EXISTENCIA,'Lecumberri' FROM PRODS_LECU UNION ALL SELECT Articulo,EXISTENCIA,'Bodega' FROM SAP_CC)X GROUP BY LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1))AS I ON C.Articulo=I.Articulo LEFT JOIN(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,ROUND(Costo,0) AS Costo FROM SAP_CC)AS D ON C.Articulo=D.Articulo WHERE C.Articulo NOT IN('2064VE','2065VE','2066VE','2068VE','2071VE','2074VE','2077VE','2078VE','2085VE','4000BA') GROUP BY C.Articulo ORDER BY Total_Sales DESC",

kardex:(art)=>"SELECT Ubicacion,CONVERT(VARCHAR(10),Fecha,103) AS Fecha,ISNULL(Referencia,'') AS Referencia,TipoMov,Descripcion,Entrada,Salida FROM(SELECT 'BODEGA' AS Ubicacion,Fecha,CAST(NULL AS VARCHAR(50)) AS Referencia,'ENTRADA' AS TipoMov,Articulo AS Descripcion,Cantidad AS Entrada,0 AS Salida FROM PAR_INVENT WHERE Articulo LIKE '"+art+"%' AND Fecha BETWEEN '{{fecha1}}' AND '{{fecha2}}' UNION ALL SELECT 'BODEGA',Fecha,CAST(N_Documento AS VARCHAR(50)),'SALIDA '+CASE Cliente WHEN 'TS0001' THEN 'LEONA' WHEN 'TS0002' THEN 'CERCU' WHEN 'TS0003' THEN 'LECUM' WHEN 'TS0004' THEN 'CHINCO' WHEN 'TS0005' THEN 'DOSMASTRES' WHEN 'TS0006' THEN 'INTERNO' ELSE Cliente END,Articulo,0,Cantidad FROM PAR_INVSAL WHERE Articulo LIKE '"+art+"%' AND Fecha BETWEEN '{{fecha1}}' AND '{{fecha2}}' UNION ALL SELECT 'CIRCUNVALACION',Fecha,CAST(NO_REFEREN AS VARCHAR(50)),'VENTA',Articulo,0,Cantidad FROM MOVS_CIRCUNVALACION WHERE LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1)='"+art+"' AND Movimiento='TK' AND Fecha BETWEEN '{{fecha1}}' AND '{{fecha2}}' UNION ALL SELECT 'LEONA VICARIO',Fecha,CAST(NO_REFEREN AS VARCHAR(50)),'VENTA',Articulo,0,Cantidad FROM MOVS_LEONA WHERE LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1)='"+art+"' AND Movimiento='TK' AND Fecha BETWEEN '{{fecha1}}' AND '{{fecha2}}' UNION ALL SELECT 'LECUMBERRI',Fecha,CAST(NO_REFEREN AS VARCHAR(50)),'VENTA',Articulo,0,Cantidad FROM MOVS_LECUMBERRI WHERE LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1)='"+art+"' AND Movimiento='TK' AND Fecha BETWEEN '{{fecha1}}' AND '{{fecha2}}' UNION ALL SELECT 'CHINCONCUAC',Fecha,CAST(NO_REFEREN AS VARCHAR(50)),'VENTA',Articulo,0,Cantidad FROM MOVS_CHINCONCUAC WHERE LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1)='"+art+"' AND Movimiento='TK' AND Fecha BETWEEN '{{fecha1}}' AND '{{fecha2}}')K ORDER BY Fecha,Ubicacion",

corteCercu:()=>"SELECT numeroCorte,corte,cadenaSalida,ISNULL(totalVentas,0) AS totalVentas,estacion,usufecha,usuhora,ISNULL(totalIngresos,0) AS totalIngresos,ISNULL(totalEgresos,0) AS totalEgresos,ISNULL(totalCaja,0) AS totalCaja,ISNULL(ventasCredito,0) AS ventasCredito,ISNULL(valesEmitidos,0) AS valesEmitidos,ISNULL(valesCambio,0) AS valesCambio,ISNULL(ingresosCobranza,0) AS ingresosCobranza,ISNULL(totalVentasUnidades,0) AS totalVentasUnidades,ISNULL(clientesAtendidos,0) AS clientesAtendidos,ISNULL(cajero,'') AS cajero,ISNULL(importeCajero,0) AS importeCajero FROM CORTESZX_C WHERE usufecha='{{fecha}}' ORDER BY numeroCorte",

corteLeona:()=>"SELECT numeroCorte,corte,cadenaSalida,ISNULL(totalVentas,0) AS totalVentas,estacion,usufecha,usuhora,ISNULL(totalIngresos,0) AS totalIngresos,ISNULL(totalEgresos,0) AS totalEgresos,ISNULL(totalCaja,0) AS totalCaja,ISNULL(ventasCredito,0) AS ventasCredito,ISNULL(valesEmitidos,0) AS valesEmitidos,ISNULL(valesCambio,0) AS valesCambio,ISNULL(ingresosCobranza,0) AS ingresosCobranza,ISNULL(totalVentasUnidades,0) AS totalVentasUnidades,ISNULL(clientesAtendidos,0) AS clientesAtendidos,ISNULL(cajero,'') AS cajero,ISNULL(importeCajero,0) AS importeCajero FROM CORTESZX_L WHERE usufecha='{{fecha}}' ORDER BY numeroCorte",

styleAnalysis:(arts)=>"SELECT C.Articulo,C.Store,SUM(C.Cantidad) AS Qty,ROUND(SUM(C.Cantidad*C.Precio_Venta),0) AS Revenue,ROUND(SUM(ISNULL(C.Costo,0)*C.Cantidad),0) AS TotalCost,ROUND(SUM((C.Precio_Venta-ISNULL(C.Costo,0))*C.Cantidad),0) AS Profit,ROUND(CASE WHEN SUM(C.Cantidad*C.Precio_Venta)=0 THEN 0 ELSE 100.0*SUM((C.Precio_Venta-ISNULL(C.Costo,0))*C.Cantidad)/SUM(C.Cantidad*C.Precio_Venta) END,1) AS MarginPct FROM(SELECT LEFT(M.Articulo,CHARINDEX('-',M.Articulo+'-')-1) AS Articulo,M.Cantidad,M.Precio_Venta,ISNULL(CC.Costo,0) AS Costo,'Circunvalacion' AS Store FROM MOVS_CIRCUNVALACION M LEFT JOIN SAP_CC CC ON CC.Articulo=M.Articulo WHERE M.FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND M.Movimiento='TK' UNION ALL SELECT LEFT(M.Articulo,CHARINDEX('-',M.Articulo+'-')-1),M.Cantidad,M.Precio_Venta,ISNULL(CC.Costo,0),'Leona' FROM MOVS_LEONA M LEFT JOIN SAP_CC CC ON CC.Articulo=M.Articulo WHERE M.FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND M.Movimiento='TK' UNION ALL SELECT LEFT(M.Articulo,CHARINDEX('-',M.Articulo+'-')-1),M.Cantidad,M.Precio_Venta,ISNULL(CC.Costo,0),'Lecumberri' FROM MOVS_LECUMBERRI M LEFT JOIN SAP_CC CC ON CC.Articulo=M.Articulo WHERE M.FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND M.Movimiento='TK' UNION ALL SELECT LEFT(M.Articulo,CHARINDEX('-',M.Articulo+'-')-1),M.Cantidad,M.Precio_Venta,ISNULL(CC.Costo,0),'Chinconcuac' FROM MOVS_CHINCONCUAC M LEFT JOIN SAP_CC CC ON CC.Articulo=M.Articulo WHERE M.FECHA BETWEEN '{{fecha1}}' AND '{{fecha2}}' AND M.Movimiento='TK')C WHERE C.Articulo IN("+arts+") GROUP BY C.Articulo,C.Store ORDER BY C.Articulo,C.Store",

styleInventory:(arts)=>"SELECT I.Articulo,SUM(CASE WHEN I.Store='Circunvalacion' THEN I.EXISTENCIA ELSE 0 END) AS Cercu,SUM(CASE WHEN I.Store='Leona' THEN I.EXISTENCIA ELSE 0 END) AS Leona,SUM(CASE WHEN I.Store='Lecumberri' THEN I.EXISTENCIA ELSE 0 END) AS Lecum,SUM(CASE WHEN I.Store='Chinconcuac' THEN I.EXISTENCIA ELSE 0 END) AS Chinco,SUM(CASE WHEN I.Store='Bodega' THEN I.EXISTENCIA ELSE 0 END) AS Bodega,SUM(I.EXISTENCIA) AS Total FROM(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,EXISTENCIA,'Circunvalacion' AS Store FROM PRODS_C UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Leona' FROM PRODS_L UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Lecumberri' FROM PRODS_LECU UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Chinconcuac' FROM PRODS_CHIN UNION ALL SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1),EXISTENCIA,'Bodega' FROM SAP_CC)I WHERE I.Articulo IN("+arts+") GROUP BY I.Articulo ORDER BY I.Articulo",

onlineSales:()=>{var base="(SELECT 'LEONA' AS Store,CAST(NO_REFEREN AS VARCHAR(50)) AS Ticket,'Store Sale' AS Sale_Type,ROUND(SUM(Cantidad*Precio_Venta),0) AS Total_Ticket,CONVERT(VARCHAR(10),MAX(FECHA),23) AS Fecha FROM MOVS_LEONA WHERE FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') AND Movimiento='TK' AND NO_REFEREN IN(SELECT DISTINCT NO_REFEREN FROM MOVS_LEONA WHERE FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') AND Movimiento='TK' AND(CANAL IS NOT NULL AND LTRIM(RTRIM(CANAL))<>'' OR Articulo IN("+OB_MARKERS+"))) GROUP BY NO_REFEREN HAVING ROUND(SUM(Cantidad*Precio_Venta),0)>0 UNION ALL SELECT CASE WHEN MAX(CASE WHEN Vendedor='YAZMIN' OR UPPER(Vendedor) LIKE '%JASMINE%' OR UPPER(Vendedor) LIKE '%JAZMIN%' THEN 1 ELSE 0 END)=1 THEN 'JASMINE' ELSE 'CERCU' END,CAST(NO_REFEREN AS VARCHAR(50)),CASE WHEN MAX(CASE WHEN Vendedor='YAZMIN' OR UPPER(Vendedor) LIKE '%JASMINE%' OR UPPER(Vendedor) LIKE '%JAZMIN%' THEN 1 ELSE 0 END)=1 THEN 'Jasmine Sale' ELSE 'Store Sale' END,ROUND(SUM(Cantidad*Precio_Venta),0),CONVERT(VARCHAR(10),MAX(FECHA),23) FROM MOVS_CIRCUNVALACION WHERE FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') AND Movimiento='TK' AND NO_REFEREN IN(SELECT DISTINCT NO_REFEREN FROM MOVS_CIRCUNVALACION WHERE FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') AND Movimiento='TK' AND(CANAL IS NOT NULL AND LTRIM(RTRIM(CANAL))<>'' OR Vendedor='YAZMIN' OR UPPER(Vendedor) LIKE '%JASMINE%' OR UPPER(Vendedor) LIKE '%JAZMIN%' OR Articulo IN("+OB_MARKERS+"))) GROUP BY NO_REFEREN HAVING ROUND(SUM(Cantidad*Precio_Venta),0)>0)";return "SELECT Store,Sale_Type,Ticket,Total_Ticket,Fecha,1 AS SortOrder FROM "+base+" a UNION ALL SELECT Store,Sale_Type,'TOTAL',SUM(Total_Ticket),NULL,2 FROM "+base+" b GROUP BY Store,Sale_Type UNION ALL SELECT 'GRAND TOTAL','ALL','TOTAL',SUM(Total_Ticket),NULL,3 FROM "+base+" c ORDER BY SortOrder,Store,Sale_Type,Ticket"},

onlineDaily:()=>"SELECT CONVERT(VARCHAR(10),M.FECHA,23) AS Fecha,'LEONA' AS Store,ROUND(SUM(M.Cantidad*M.Precio_Venta),0) AS Total_Sale,ROUND(SUM(CASE WHEN M.CANAL IS NOT NULL AND LTRIM(RTRIM(M.CANAL))<>'' OR OB.NO_REFEREN IS NOT NULL THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0) AS Online_Sale,0 AS Jasmine_Sale,COUNT(DISTINCT M.NO_REFEREN) AS Total_Tickets,COUNT(DISTINCT CASE WHEN M.CANAL IS NOT NULL AND LTRIM(RTRIM(M.CANAL))<>'' OR OB.NO_REFEREN IS NOT NULL THEN M.NO_REFEREN END) AS Online_Tickets FROM MOVS_LEONA M LEFT JOIN(SELECT DISTINCT NO_REFEREN FROM MOVS_LEONA WHERE FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') AND Movimiento='TK' AND Articulo IN("+OB_MARKERS+"))OB ON M.NO_REFEREN=OB.NO_REFEREN WHERE M.FECHA>='{{fecha1}}' AND M.FECHA<DATEADD(DAY,1,'{{fecha2}}') AND M.Movimiento='TK' GROUP BY CONVERT(VARCHAR(10),M.FECHA,23) UNION ALL SELECT CONVERT(VARCHAR(10),M.FECHA,23),'CERCU',ROUND(SUM(M.Cantidad*M.Precio_Venta),0),ROUND(SUM(CASE WHEN M.CANAL IS NOT NULL AND LTRIM(RTRIM(M.CANAL))<>'' OR M.Vendedor='YAZMIN' OR UPPER(M.Vendedor) LIKE '%JASMINE%' OR UPPER(M.Vendedor) LIKE '%JAZMIN%' OR OB.NO_REFEREN IS NOT NULL THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),ROUND(SUM(CASE WHEN M.Vendedor='YAZMIN' OR UPPER(M.Vendedor) LIKE '%JASMINE%' OR UPPER(M.Vendedor) LIKE '%JAZMIN%' THEN M.Cantidad*M.Precio_Venta ELSE 0 END),0),COUNT(DISTINCT M.NO_REFEREN),COUNT(DISTINCT CASE WHEN M.CANAL IS NOT NULL AND LTRIM(RTRIM(M.CANAL))<>'' OR M.Vendedor='YAZMIN' OR UPPER(M.Vendedor) LIKE '%JASMINE%' OR UPPER(M.Vendedor) LIKE '%JAZMIN%' OR OB.NO_REFEREN IS NOT NULL THEN M.NO_REFEREN END) FROM MOVS_CIRCUNVALACION M LEFT JOIN(SELECT DISTINCT NO_REFEREN FROM MOVS_CIRCUNVALACION WHERE FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') AND Movimiento='TK' AND Articulo IN("+OB_MARKERS+"))OB ON M.NO_REFEREN=OB.NO_REFEREN WHERE M.FECHA>='{{fecha1}}' AND M.FECHA<DATEADD(DAY,1,'{{fecha2}}') AND M.Movimiento='TK' GROUP BY CONVERT(VARCHAR(10),M.FECHA,23) ORDER BY Fecha,Store",

transfersByBank:()=>"SELECT Store,Bank,COUNT(*) AS Tickets,SUM(Sale) AS Sales,SUM(Deposit) AS Deposits FROM(SELECT 'Circunvalacion' AS Store,NO_REFEREN,UPPER(LTRIM(RTRIM(ISNULL(MAX(PAGO2),'')))) AS Bank,ROUND(SUM(Cantidad*Precio_Venta),0) AS Sale,MAX(ISNULL(PrEnvio,0)) AS Deposit,MAX(CASE WHEN UPPER(ISNULL(Tarjetas,'')) LIKE '%TRANSFER%' THEN 1 ELSE 0 END) AS St,MAX(CASE WHEN ISNULL(PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(PAGO2,'')))<>'' THEN 1 ELSE 0 END) AS Dep,MAX(CASE WHEN UPPER(ISNULL(Tarjetas,'')) LIKE '%TARJETA%' THEN 1 ELSE 0 END) AS Card FROM MOVS_CIRCUNVALACION WHERE FECHA='{{fecha}}' AND Movimiento='TK' GROUP BY NO_REFEREN UNION ALL SELECT 'Leona Vicario',NO_REFEREN,UPPER(LTRIM(RTRIM(ISNULL(MAX(PAGO2),'')))),ROUND(SUM(Cantidad*Precio_Venta),0),MAX(ISNULL(PrEnvio,0)),MAX(CASE WHEN UPPER(ISNULL(Tarjetas,'')) LIKE '%TRANSFER%' THEN 1 ELSE 0 END),MAX(CASE WHEN ISNULL(PrEnvio,0)>0 AND LTRIM(RTRIM(ISNULL(PAGO2,'')))<>'' THEN 1 ELSE 0 END),MAX(CASE WHEN UPPER(ISNULL(Tarjetas,'')) LIKE '%TARJETA%' THEN 1 ELSE 0 END) FROM MOVS_LEONA WHERE FECHA='{{fecha}}' AND Movimiento='TK' GROUP BY NO_REFEREN)X WHERE Card=0 AND(St=1 OR Dep=1) GROUP BY Store,Bank ORDER BY Store,SUM(Sale) DESC",

stockAlerts:()=>"SELECT TOP 500 S.Articulo,S.Total_Stock,S.Cercu,S.Leona,S.Lucum,S.Chinco,S.Bodega,ISNULL(V.Sold,0) AS Sold,ISNULL(D.Costo,0) AS Costo FROM(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,SUM(EXISTENCIA) AS Total_Stock,SUM(CASE WHEN Store='Circunvalacion' THEN EXISTENCIA ELSE 0 END) AS Cercu,SUM(CASE WHEN Store='Leona' THEN EXISTENCIA ELSE 0 END) AS Leona,SUM(CASE WHEN Store='Lecumberri' THEN EXISTENCIA ELSE 0 END) AS Lucum,SUM(CASE WHEN Store='Chinconcuac' THEN EXISTENCIA ELSE 0 END) AS Chinco,SUM(CASE WHEN Store='Bodega' THEN EXISTENCIA ELSE 0 END) AS Bodega FROM(SELECT Articulo,EXISTENCIA,'Circunvalacion' AS Store FROM PRODS_C UNION ALL SELECT Articulo,EXISTENCIA,'Leona' FROM PRODS_L UNION ALL SELECT Articulo,EXISTENCIA,'Chinconcuac' FROM PRODS_CHIN UNION ALL SELECT Articulo,EXISTENCIA,'Lecumberri' FROM PRODS_LECU UNION ALL SELECT Articulo,EXISTENCIA,'Bodega' FROM SAP_CC)P GROUP BY LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1))S LEFT JOIN(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,SUM(Cantidad) AS Sold FROM(SELECT Articulo,Cantidad FROM MOVS_CIRCUNVALACION WHERE Movimiento='TK' AND FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') UNION ALL SELECT Articulo,Cantidad FROM MOVS_LEONA WHERE Movimiento='TK' AND FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') UNION ALL SELECT Articulo,Cantidad FROM MOVS_LECUMBERRI WHERE Movimiento='TK' AND FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}') UNION ALL SELECT Articulo,Cantidad FROM MOVS_CHINCONCUAC WHERE Movimiento='TK' AND FECHA>='{{fecha1}}' AND FECHA<DATEADD(DAY,1,'{{fecha2}}'))MV GROUP BY LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1))V ON S.Articulo=V.Articulo LEFT JOIN(SELECT LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1) AS Articulo,ROUND(MAX(Costo),0) AS Costo FROM SAP_CC GROUP BY LEFT(Articulo,CHARINDEX('-',Articulo+'-')-1))D ON S.Articulo=D.Articulo WHERE S.Total_Stock>0 ORDER BY ISNULL(V.Sold,0) ASC,S.Total_Stock DESC",

  return{ventas:g(/Ingresos por Ventas:?\s*\$\s*([\d,]*\.?\d+)/i),tarjetas:g(/Total en Tarjetas:?\s*\$\s*([\d,]*\.?\d+)/i),transfer:g(/Total en Transfer:?\s*\$\s*([\d,]*\.?\d+)/i),efectivo:g(/Total en Efectivo:?\s*\$\s*([\d,]*\.?\d+)/i),egresos:g(/Total de Egresos:?\s*\$\s*([\d,]*\.?\d+)/i),caja:g(/Total en caja:?\s*\$\s*([\d,]*\.?\d+)/i),inicial:g(/Inicial en Caja:?\s*\$\s*([\d,]*\.?\d+)/i)};

function colNumFromName(l){var n=0;for(var i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return n}
function colNameFromNum(n){var s="";while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function shiftFormulaCols(f,insertedAt){
  return String(f).replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g,function(m,d1,L,d2,num,off,str){
    if(!d1&&off>0&&/[A-Za-z0-9_.]/.test(str.charAt(off-1)))return m;
    var n=colNumFromName(L);
    return n>=insertedAt?d1+colNameFromNum(n+1)+d2+num:m;
  });
}
function fetchDriveImageData(url){
  var big=url.replace("=w200","=w400");
  function toResult(blob){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var b64=String(fr.result).split(",")[1];
        var img=new Image();var u=URL.createObjectURL(blob);
        img.onload=function(){URL.revokeObjectURL(u);res({base64:b64,w:img.naturalWidth,h:img.naturalHeight})};
        img.onerror=function(){URL.revokeObjectURL(u);rej(new Error("bad image"))};
        img.src=u;
      };
      fr.onerror=function(){rej(new Error("read failed"))};
      fr.readAsDataURL(blob);
    });
  }
  return fetch(big,{mode:"cors"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.blob()}).then(toResult)
    .catch(function(){
      var m=big.match(/\/d\/([^=\/]+)/);
      if(!m)throw new Error("no image id");
      return fetch("/api/img?id="+m[1]).then(function(r){if(!r.ok)throw new Error("image proxy "+r.status);return r.blob()}).then(toResult);
    });
}
/* ExcelJS can't parse namespace-prefixed OOXML (openpyxl/other exporters) or some
   embedded tables. Normalize the package first: strip the spreadsheetml prefix and
   remove table parts, which we don't need. Excel-native files pass through unchanged. */
async function normalizeXlsx(arrayBuffer,JSZip){
  var zin=await JSZip.loadAsync(arrayBuffer);
  var zout=new JSZip();
  var norm=function(t){
    t=t.replace(/^﻿/,"");
    var m=t.match(/xmlns:([A-Za-z0-9]+)\s*=\s*"http:\/\/schemas\.openxmlformats\.org\/spreadsheetml\/2006\/main"/);
    if(m){var p=m[1];
      t=t.replace(new RegExp("<"+p+":","g"),"<").replace(new RegExp("</"+p+":","g"),"</");
      t=t.replace(m[0],'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"');
    }
    return t.replace(/<tableParts[\s\S]*?<\/tableParts>/g,"").replace(/<tableParts[^>]*\/>/g,"");
  };
  var names=Object.keys(zin.files);
  for(var i=0;i<names.length;i++){
    var name=names[i],f=zin.files[name];
    if(f.dir)continue;
    if(/^xl\/tables\//i.test(name))continue;
    if(/_rels\/[^\/]*\.rels$/i.test(name)){
      var t=(await f.async("string")).replace(/^﻿/,"");
      t=t.replace(/<Relationship\b[^>]*\/table\d*\.xml"[^>]*\/>/gi,"").replace(/<Relationship\b[^>]*Type="[^"]*\/table"[^>]*\/>/gi,"");
      zout.file(name,t);continue;
    }
    if(/\[Content_Types\]\.xml$/i.test(name)){
      var ct=(await f.async("string")).replace(/^﻿/,"").replace(/<Override\b[^>]*\/xl\/tables\/[^>]*\/>/gi,"");
      zout.file(name,ct);continue;
    }
    if(/\.(xml|rels)$/i.test(name))zout.file(name,norm(await f.async("string")));
    else zout.file(name,await f.async("uint8array"));
  }
  return zout.generateAsync({type:"arraybuffer"});
}
function withTimeout(promise,ms,msg){
  return Promise.race([promise,new Promise(function(_,rej){setTimeout(function(){rej(new Error(msg))},ms)})]);
}
async function processExcelPhotos(arrayBuffer,fileName,onProgress){
  var XL=await loadExcelJS();
  if(!Object.keys(GDRIVE_IMG_MAP).length)throw new Error("Product photos are still loading from Google Drive — wait a few seconds and try again.");
  // Always normalize first: a raw load can hang forever on prefixed/openpyxl files.
  // For Excel-native files the normalizer is effectively a no-op (only strips tables).
  var JSZip=await loadJSZip();
  var fixed=await normalizeXlsx(arrayBuffer,JSZip);
  var wb=new XL.Workbook();
  await withTimeout(wb.xlsx.load(fixed),45000,"This Excel file could not be read. Try re-saving it from Excel as .xlsx and upload again.");
  if(!wb.worksheets.length)throw new Error("No sheet with data was found in this file.");
  var ws=wb.worksheets[0];
  if(!ws)throw new Error("No sheet found in this file.");
  var styleCol=null,headerRow=0;
  var hdrRe=/^(style|styles|estilo|estilos|articulo|artículo|item|item code|codigo|código|clave|modelo|sku|style number)\b/i;
  for(var r=1;r<=Math.min(ws.rowCount,20)&&!styleCol;r++){
    for(var c=1;c<=30&&!styleCol;c++){
      var v=ws.getRow(r).getCell(c).value;

  var biasWindow=training.slice(-14);var biasSum=0;var biasCnt=0;
  biasWindow.forEach(function(d){
    var dt=parseLocalDate(d.Fecha);var dow=dt.getDay();var mo=dt.getMonth();
    var raw=dowAvg[dow]*monthFactor[mo]*trend;
    if(raw>0){biasSum+=(d.Total_Sale/raw);biasCnt++}
  });
  var biasFactor=biasCnt>0?biasSum/biasCnt:1;
  biasFactor=Math.max(0.7,Math.min(1.3,biasFactor));
  var results=[];var cur=parseLocalDate(predStart);var end=parseLocalDate(predEnd);
  while(cur<=end){
    var y=cur.getFullYear(),m=String(cur.getMonth()+1).padStart(2,"0"),dy=String(cur.getDate()).padStart(2,"0");
    var ds=y+"-"+m+"-"+dy;var dow=cur.getDay();var mo=cur.getMonth();
    var wk=getISOWeek(cur)+"-"+dow;
    var pred=dowAvg[dow]*monthFactor[mo];
    if(wdSum[wk]&&wdW[wk]>0){var wp=wdSum[wk]/wdW[wk];pred=pred*0.5+wp*0.5}
    pred=pred*trend*biasFactor;pred=Math.round(pred);
    var act=actual[ds];var av=act?act.Total_Sale:null;
    var err=av!==null?Math.abs(pred-av):null;
    var ep=av!==null&&av>0?Math.round((err/av)*1000)/10:null;
    results.push({Fecha:ds,Dia:DIAS[dow],Predicted:pred,Actual:av,Error:err,ErrorPct:ep});
    cur.setDate(cur.getDate()+1);
  }

  var mape=wa.length>0?Math.round(wa.reduce(function(s,r){return s+r.ErrorPct},0)/wa.length*10)/10:null;
  return{results:results,mape:mape,trend:trend,trainingDays:training.length,biasFactor:Math.round(biasFactor*1000)/1000}
}
